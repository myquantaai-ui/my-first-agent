<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NVIDIA AI Agent</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 700px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    .card { background: #f4f4f5; border-radius: 8px; padding: 1.5rem; margin-bottom: 1.5rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.25rem; font-size: 0.9rem; }
    input, textarea, button { width: 100%; box-sizing: border-box; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; margin-bottom: 1rem; }
    button { background-color: #76b900; color: white; border: none; font-weight: 600; cursor: pointer; }
    button:disabled { background-color: #a3d944; cursor: not-allowed; }
    #log { background: #18181b; color: #4ade80; padding: 1rem; border-radius: 6px; font-family: monospace; white-space: pre-wrap; font-size: 0.85rem; min-height: 60px; }
    .media-preview { margin-top: 1rem; text-align: center; }
    img { max-width: 100%; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-top: 0.5rem; }
  </style>
</head>
<body>

  <h2>🎬 NVIDIA AI Media Agent</h2>

  <div class="card">
    <label for="nvidiaKey">NVIDIA API Key</label>
    <input type="password" id="nvidiaKey" placeholder="nvapi-..." />
  </div>

  <div class="card">
    <label for="userPrompt">Your Concept Idea</label>
    <textarea id="userPrompt" rows="3" placeholder="e.g. A futuristic cybernetic cat sitting on a neon rain-slicked roof..."></textarea>
    <button id="generateBtn" onclick="startAgent()">Generate with NVIDIA NIM</button>
  </div>

  <div id="log">Status: Waiting to run...</div>

  <div class="media-preview">
    <div id="imageOutput"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
